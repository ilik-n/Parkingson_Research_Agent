# Weekly Parkinson's Advances feed update.
#
# Auth: uses a Claude Pro subscription via OAuth token, not a paid API key. One-time setup
# (do this yourself, not something Claude Code can do on your behalf):
#   1. Install the Claude GitHub App on this repo — run `/install-github-app` in a local Claude
#      Code session, or install from https://github.com/apps/claude
#   2. Run `claude setup-token` locally (while logged into your Pro account) to generate a token
#   3. Add it as a repo secret named CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables >
#      Actions) — never commit it to the repo
#
# Known rough edge: Pro/Max OAuth tokens for GitHub Actions have open upstream issues around
# expiry/refresh (see https://github.com/anthropics/claude-code-action/issues/727 and #1281) —
# this is not fully "set and forget" yet. If the weekly run starts failing with an auth error,
# re-run `claude setup-token` and update the secret before assuming something else broke.
#
# NOTE before first real run: this uses anthropics/claude-code-action@v1, whose exact `with:`
# inputs have changed across versions — verify against the action's current README
# (https://github.com/anthropics/claude-code-action) before relying on this, and do one manual
# workflow_dispatch run to confirm before trusting the cron schedule.

name: Weekly Parkinson's feed update

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC — tune once the real cadence (plan.md §6) is proven
  workflow_dispatch: {} # manual on-demand override, per plan.md §6

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for claude-code-action@v1 to fetch its GitHub OIDC token

jobs:
  draft-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the feed is well-formed before touching it
        run: python update_feed.py validate

      - name: Retire entries older than the retention window
        run: python update_feed.py retire

      - name: Commit retirement changes directly (deterministic, no review needed)
        run: |
          if ! git diff --quiet -- data/updates.json; then
            git config user.name "parkinsons-feed-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/updates.json
            git commit -m "Retire entries past the retention window"
            git push
          fi

      - name: Load agent instructions
        id: load_prompt
        run: |
          {
            echo 'prompt<<PROMPT_EOF'
            cat .github/workflows/update-feed-prompt.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Research + draft new entries, open a PR for review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.load_prompt.outputs.prompt }}
          # Bash/WebFetch/WebSearch are denied by default (see claude-code-action docs) — without
          # this, the agent can't reach the curated sources or run update_feed.py, and silently
          # concludes there's nothing new instead of actually researching (confirmed by the first
          # real run: 8/8 permission denials, zero PR, in ~1 minute). The PR-review gate in
          # update-feed-prompt.md is the safety guardrail here, not tool restriction — so this
          # allowlist covers exactly what that prompt's steps 1-7 need, nothing broader.
          claude_args: |
            --allowedTools "WebFetch,WebSearch,Write,Bash(python update_feed.py add:*),Bash(python update_feed.py validate:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(gh pr create:*)"
          show_full_output: true # first real run hid all agent turns; keep this on while bringing the pipeline up
