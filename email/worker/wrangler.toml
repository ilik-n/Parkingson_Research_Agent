name = "parkinsons-advances-digest"
main = "src/index.js"
compatibility_date = "2026-08-23"

[[d1_databases]]
binding = "DB"
database_name = "parkinsons-advances-subscribers"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"

[vars]
SITE_ORIGIN = "https://ilik-n.github.io"
UPDATES_JSON_URL = "https://raw.githubusercontent.com/ilik-n/Parkingson_Research_Agent/main/data/updates.json"
# The deployed *.workers.dev URL (or custom domain) this Worker is reachable at — used to build
# confirm/unsubscribe links in emails. Update after your first `wrangler deploy` prints it.
WORKER_ORIGIN = "REPLACE_AFTER_FIRST_DEPLOY"
# Sending address. Resend's shared sandbox domain only delivers to the email you signed up to
# Resend with — see ../README.md before expecting real subscribers to receive anything.
RESEND_FROM_EMAIL = "onboarding@resend.dev"

# Secrets (not stored here — set via `wrangler secret put <NAME>`):
#   RESEND_API_KEY   — from resend.com
#   DIGEST_SECRET    — a random string you generate; also set as the DIGEST_SECRET GitHub
#                       Actions secret on the repo so the publish workflow can call /send-digest
